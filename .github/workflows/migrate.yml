name: Supabase DB Push

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Mark existing migrations as applied
        run: |
          supabase migration repair --status applied 20260627120000 || true
          supabase migration repair --status applied 20260627130000 || true
          supabase migration repair --status applied 20260627140000 || true
          supabase migration repair --status applied 20260627_initial_schema || true
          supabase migration repair --status applied 20260711000000 || true
          supabase migration repair --status applied 20260712000000 || true
          supabase migration repair --status applied 20260712010000 || true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push new migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
